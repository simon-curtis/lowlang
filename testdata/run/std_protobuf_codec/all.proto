syntax = "proto3";
package t;

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
  NEG = -3;
}

message Inner {
  int32 a = 1;
  string b = 2;
  repeated int32 c = 3;
}

message Scalars {
  int32 i32 = 1;
  int64 i64 = 2;
  uint32 u32 = 3;
  uint64 u64 = 4;
  sint32 s32 = 5;
  sint64 s64 = 6;
  fixed32 f32 = 7;
  fixed64 f64 = 8;
  sfixed32 sf32 = 9;
  sfixed64 sf64 = 10;
  float fl = 11;
  double db = 12;
  bool flag = 13;
  string str = 14;
  bytes raw = 15;
  Color color = 16;
  Inner inner = 17;
  optional int32 maybe = 18;
  repeated int32 packed = 19;
  repeated int32 loose = 20 [packed = false];
  repeated string names = 21;
  repeated Inner inners = 22;
  map<string, int32> counts = 23;
  map<int32, Inner> by_id = 24;
  repeated sint64 zz = 25;
  repeated fixed32 fx = 26;
  repeated double ds = 27;
  repeated Color colors = 28;
  oneof choice {
    int32 num = 30;
    string word = 31;
    Inner node = 32;
  }
}
