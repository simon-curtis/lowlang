syntax = "proto3";
package rich.v1;

import "google/protobuf/timestamp.proto";
import public "google/protobuf/duration.proto";

enum Status {
  option allow_alias = true;
  STATUS_UNKNOWN = 0;
  STATUS_OK = 1;
  STATUS_FINE = 1;
  STATUS_2FAST = 2;
  OTHER = 3 [deprecated = true];
}

message Event {
  enum Kind {
    KIND_NONE = 0;
    KIND_START = 1;
  }
  message Detail {
    string note = 1;
    Event parent = 2;
  }
  Kind kind = 1;
  Detail detail = 2;
  google.protobuf.Timestamp when = 3;
  google.protobuf.Duration after = 4;
  Status status = 5;
  repeated Detail history = 6;
  map<sint32, fixed64> ids = 7;
  map<string, Detail> notes = 8;
  string fn = 9;
  int32 in = 10;
  string camelCase = 11;
  bool type = 12 [deprecated = true];
  repeated uint64 loose = 13 [packed = false];
  oneof payload {
    sint64 delta = 20;
    Event child = 21;
    string label = 22;
    Detail info = 23;
  }
  optional string maybe = 30;
  optional Detail maybe_detail = 31;
}

message Tree {
  Leaf leaf = 1;
  repeated Tree kids = 2;
}

message Leaf {
  Tree owner = 1;
  Branch branch = 2;
}

message Branch {
  Leaf leaf = 1;
}

message Empty {}

service Events {
  rpc Get(Event) returns (Event);
  rpc Watch(Event) returns (stream Event);
  rpc Upload(stream Event) returns (Empty);
  rpc Chat(stream Event) returns (stream Event);
}
