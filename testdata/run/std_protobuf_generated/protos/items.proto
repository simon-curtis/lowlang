syntax = "proto2";
package items.v1;

import "kinds.proto";

message Item {
  required string name = 1;
  optional int32 count = 2 [default = 5];
  optional string note = 3 [default = "a\"{b}\n"];
  optional bytes blob = 4 [default = "\000x"];
  optional float ratio = 5 [default = 1.5];
  optional int64 delta = 6 [default = -7];
  optional kinds.v1.Kind kind = 7 [default = KIND_B];
  optional bool flag = 8 [default = true];
  optional string plain = 9;
  repeated int32 loose = 10;
  repeated int32 tight = 11 [packed = true];
  repeated kinds.v1.Kind kind_list = 12;
  optional Item next = 13;
  required Inner inner = 14;
  optional double wide = 15 [default = 100];
  optional uint32 small = 16 [default = 4000000000];

  message Inner {
    optional int32 v = 1;
  }
}
