syntax = "proto3";
package helloworld;

import "shapes.proto";

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
  int64 count = 2;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc LotsOfReplies(HelloRequest) returns (stream HelloReply);
  rpc LotsOfGreetings(stream HelloRequest) returns (HelloReply);
  rpc BidiHello(stream HelloRequest) returns (stream HelloReply);
  rpc Measure(shapes.v1.Shape) returns (shapes.v1.Area);
}

service Farewell {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc return(HelloRequest) returns (HelloReply);
}

service Empty {
}
