syntax = "proto2";
package people.test;

import public "other.proto";
import weak "weak.proto";

option java_package = "com.example";
option (my.file_opt) = { a: 1 b: "x" nested { c: [1, 2] } };

message Person {
  required string name = 1;
  optional int32 id = 2 [default = -5];
  optional string tag = 3 [default = "a\tb\x41\101\u00e9{}", json_name = "TAG"];
  optional Kind kind = 4 [default = ADULT];
  optional double ratio = 5 [default = 1.5e3];
  optional bytes raw = 6 [default = "\000\377"];
  optional bool flag = 7 [default = true];
  optional float big = 8 [default = inf];
  repeated int32 nums = 9 [packed = true];
  optional .people.test.Person.Nested nested = 11;
  extensions 100 to 199, 1000 to max;
  reserved 15, 17 to 19;
  reserved "old", "older";

  enum Kind {
    option allow_alias = true;
    CHILD = 0;
    ADULT = 1;
    GROWNUP = 1;
    NEG = -1;
    HEX = 0x10;
    OCT = 010;
    DEAD = 20 [deprecated = true];
    reserved 30 to 40;
    reserved "GONE";
  }

  message Nested {
    optional Person parent = 1;
    map<int64, Nested> kids = 2;
    repeated .people.test.Person.Kind kinds = 3;
  }

  oneof pick {
    option (my.oneof_opt) = true;
    int32 a = 20;
    string b = 21;
    .people.test.Person.Nested c = 22;
  }

  option (my.msg_opt).sub = 3;
  optional int32 marked = 30 [(my.field_opt) = true, deprecated = true];
}

extend Person {
  optional int32 extra = 100;
}

service Directory {
  rpc Find(Person) returns (Person) {
    option deprecated = true;
  }
}
