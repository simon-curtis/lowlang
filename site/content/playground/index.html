<section class="playground-page wrap row">
<h1 class="title">Playground</h1>
<p class="lead">Write a program, compile it and run it in this tab. The compiler runs as WebAssembly, so nothing leaves the browser. Share makes a link that holds the program.</p>
<div class="playground">
<div class="run-bar">
<button class="run-button" type="button" data-run>Run</button>
<button class="run-button" type="button" data-stop hidden>Stop</button>
<button class="run-button" type="button" data-share>Share</button>
<span class="run-status" role="status"></span>
<span class="share-status" role="status"></span>
<kbd class="run-keys">Ctrl Enter</kbd>
</div>
<label class="sr-only" for="source">Low program</label>
<div class="playground-editor">
<pre class="playground-paint" aria-hidden="true" {{words}}><code></code></pre>
<textarea id="source" class="playground-source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" rows="18">fn main() {
    let names = ["Low", "WebAssembly"]
    for name in names {
        print("Hello, {name}")
    }
}
</textarea>
</div>
<div class="key-bar" role="toolbar" aria-label="Code keys" hidden>
<div class="key-strip">
<button class="key" type="button" tabindex="-1" data-action="indent" aria-label="Indent">Tab</button>
<button class="key" type="button" tabindex="-1" data-insert="{" aria-label="Open brace">{</button>
<button class="key" type="button" tabindex="-1" data-insert="}" aria-label="Close brace">}</button>
<button class="key" type="button" tabindex="-1" data-insert="(" aria-label="Open parenthesis">(</button>
<button class="key" type="button" tabindex="-1" data-insert=")" aria-label="Close parenthesis">)</button>
<button class="key" type="button" tabindex="-1" data-insert="&quot;" aria-label="Quote">"</button>
<button class="key" type="button" tabindex="-1" data-action="up" data-repeat aria-label="Move up"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
<button class="key" type="button" tabindex="-1" data-action="down" data-repeat aria-label="Move down"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></button>
<button class="key" type="button" tabindex="-1" data-action="undo" aria-label="Undo"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
<button class="key" type="button" tabindex="-1" data-action="left" data-repeat aria-label="Move left"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
<button class="key" type="button" tabindex="-1" data-action="right" data-repeat aria-label="Move right"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
<button class="key" type="button" tabindex="-1" data-insert="=" aria-label="Equals">=</button>
<button class="key" type="button" tabindex="-1" data-insert="." aria-label="Full stop">.</button>
<button class="key" type="button" tabindex="-1" data-insert=":" aria-label="Colon">:</button>
<button class="key" type="button" tabindex="-1" data-insert="[" aria-label="Open bracket">[</button>
<button class="key" type="button" tabindex="-1" data-insert="]" aria-label="Close bracket">]</button>
<button class="key" type="button" tabindex="-1" data-insert=";" aria-label="Semicolon">;</button>
<button class="key" type="button" tabindex="-1" data-insert="," aria-label="Comma">,</button>
<button class="key" type="button" tabindex="-1" data-insert="&lt;" aria-label="Less than">&lt;</button>
<button class="key" type="button" tabindex="-1" data-insert="&gt;" aria-label="Greater than">&gt;</button>
<button class="key" type="button" tabindex="-1" data-insert="!" aria-label="Exclamation mark">!</button>
<button class="key" type="button" tabindex="-1" data-insert="|" aria-label="Vertical bar">|</button>
<button class="key" type="button" tabindex="-1" data-insert="&amp;" aria-label="Ampersand">&amp;</button>
<button class="key" type="button" tabindex="-1" data-insert="_" aria-label="Underscore">_</button>
<button class="key" type="button" tabindex="-1" data-insert="+" aria-label="Plus">+</button>
<button class="key" type="button" tabindex="-1" data-insert="-" aria-label="Minus">-</button>
<button class="key" type="button" tabindex="-1" data-insert="*" aria-label="Asterisk">*</button>
<button class="key" type="button" tabindex="-1" data-insert="/" aria-label="Slash">/</button>
<button class="key" type="button" tabindex="-1" data-insert="&#x27;" aria-label="Apostrophe">'</button>
<button class="key" type="button" tabindex="-1" data-insert="?" aria-label="Question mark">?</button>
</div>
<button class="key key-run" type="button" tabindex="-1" data-action="run" aria-label="Run program"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
<button class="key key-done" type="button" tabindex="-1" data-action="done" aria-label="Hide keyboard"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<div class="run-output" role="log" tabindex="0" hidden></div>
</div>
<noscript><p>The playground needs JavaScript.</p></noscript>
</section>
