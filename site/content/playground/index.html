<section class="wrap pt-28 pb-24 sm:pt-32">
<h1 class="title">Playground</h1>
<p class="lead">Write a program, compile it and run it in this tab. The compiler runs as WebAssembly, so nothing leaves the browser. Share copies a link that holds the program.</p>
<div class="playground mt-10">
<div class="run-bar">
<button class="run-button" type="button" data-run>Run</button>
<button class="run-button" type="button" data-stop hidden>Stop</button>
<button class="run-button" type="button" data-share>Share</button>
<span class="run-status" role="status"></span>
<span class="share-status" role="status"></span>
<kbd class="run-keys">Ctrl Enter</kbd>
</div>
<label class="sr-only" for="source">Low program</label>
<textarea id="source" class="playground-source" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" rows="18">fn main() {
    let names = ["Low", "WebAssembly"]
    for name in names {
        print("Hello, {name}")
    }
}
</textarea>
<div class="run-output" role="log" tabindex="0" hidden></div>
</div>
<noscript><p class="mt-6">The playground needs JavaScript.</p></noscript>
</section>
