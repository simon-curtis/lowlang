name: Bug
description: The compiler crashes, miscompiles, rejects a valid program or accepts an invalid one
labels: [bug]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Compiler crash
        - Wrong output at run time
        - Valid program rejected
        - Invalid program accepted
        - Standard library
        - LSP, lint or editor support
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `low version`
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Host and target
      options:
        - Linux host, linux/amd64 target
        - Linux host, windows/amd64 target
        - Windows host, windows/amd64 target
        - Windows host, linux/amd64 target
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The smallest program that shows the bug
      render: low
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: low run main.low
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Output, error or panic, verbatim
      render: text
    validations:
      required: true
