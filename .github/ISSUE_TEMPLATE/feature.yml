name: Feature
description: A language construct, standard library module or tooling change
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language
        - Standard library
        - Compiler or code generation
        - LSP, lint or editor support
        - Website or docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible to write today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change, with Low code showing it in use
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
