name: site

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap the compiler
        run: ./bootstrap.sh "$RUNNER_TEMP/bootstrap/low"

      - name: Build the compiler from the tree
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bootstrap/low" build compiler/low -o "$RUNNER_TEMP/bin/low"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: site
          node-version: 24
          cache: true

      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp run site

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=low --branch=main
