name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - editors/README.md
      - internal/**
      - cmd/**
      - go.mod
      - .github/workflows/site.yml
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Collect served files
        run: rsync -a --exclude node_modules --exclude '*.mjs' --exclude 'package*.json' --exclude tailwind.css site/ dist/

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=low --branch=main
