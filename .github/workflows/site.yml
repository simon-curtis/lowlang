name: site

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build

      - name: Collect served files
        run: rsync -a --exclude node_modules --exclude /content --exclude '*.mjs' --exclude 'package*.json' --exclude tailwind.css site/ dist/

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=low --branch=main
