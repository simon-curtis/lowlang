name: fuzz

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      time:
        description: How long to fuzz, as a duration such as 90m
        default: 60m

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap the compiler
        run: ./bootstrap.sh dist/low

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build the fuzzer
        run: dist/low build compiler/lowfuzz -o dist/lowfuzz

      - name: Fuzz
        id: fuzz
        env:
          DURATION: ${{ inputs.time || '60m' }}
        run: |
          dist/lowfuzz \
            -seed "$GITHUB_RUN_ID" \
            -time "$DURATION" \
            -workers "$(nproc)" \
            -out "$RUNNER_TEMP/lowfuzz" \
            -fixtures "$RUNNER_TEMP/lowfuzz-fixtures" \
            | tee "$RUNNER_TEMP/lowfuzz.log"

      - uses: actions/upload-artifact@v5
        if: failure() && steps.fuzz.outcome == 'failure'
        with:
          name: lowfuzz-findings
          path: |
            ${{ runner.temp }}/lowfuzz
            ${{ runner.temp }}/lowfuzz-fixtures
            ${{ runner.temp }}/lowfuzz.log
          if-no-files-found: ignore

      - name: Open an issue
        if: failure() && steps.fuzz.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create fuzz --color d93f0b --description "Found by compiler/lowfuzz" --force
          {
            printf 'The scheduled fuzz run found a failure: %s\n\n' "$RUN_URL"
            printf 'Seed: %s. The minimised programs and fixtures are in the `lowfuzz-findings` artifact of the run.\n\n' "$GITHUB_RUN_ID"
            printf '```\n'
            tail -n 40 "$RUNNER_TEMP/lowfuzz.log"
            printf '```\n'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create \
            --title "fuzz: findings in run $GITHUB_RUN_ID" \
            --label fuzz \
            --body-file "$RUNNER_TEMP/issue.md"
