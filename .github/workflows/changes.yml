name: changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require fixtures, docs and examples to come with the change
        run: .githooks/changes "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
