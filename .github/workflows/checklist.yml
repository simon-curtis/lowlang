name: checklist

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Require every checklist item to be ticked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          unchecked=$(printf '%s\n' "$BODY" | grep -E '^- \[ \]' || true)
          checked=$(printf '%s\n' "$BODY" | grep -c -E '^- \[[xX]\]' || true)
          if [ "$checked" -eq 0 ] && [ -z "$unchecked" ]; then
            echo "::error::The pull request body has no checklist. Use .github/pull_request_template.md."
            exit 1
          fi
          if [ -n "$unchecked" ]; then
            echo "::error::Unticked checklist items:"
            printf '%s\n' "$unchecked"
            exit 1
          fi
