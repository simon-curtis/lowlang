name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install libraries linked by test programs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Let Chromium create its sandbox for the std/cdp programs
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
