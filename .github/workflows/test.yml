name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap the compiler
        run: ./bootstrap.sh dist/low

      - name: Build the compiler, harness and UI tests for Windows
        run: |
          mkdir -p dist/windows
          dist/low build compiler/low -target windows/amd64 -o dist/windows/low.exe
          dist/low build compiler/lowtest -target windows/amd64 -o dist/windows/lowtest.exe
          dist/low build compiler/tests/ui -target windows/amd64 -o dist/windows/ui-tests.exe

      - uses: actions/upload-artifact@v5
        with:
          name: low
          path: dist/low
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: low-windows
          path: dist/windows
          if-no-files-found: error

  fixtures:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: low
          path: dist

      - name: Put low on PATH
        run: |
          chmod +x dist/low
          echo "$GITHUB_WORKSPACE/dist" >> "$GITHUB_PATH"

      - name: Install libraries linked by test programs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Let Chromium create its sandbox for the std/cdp programs
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the harness
        run: low build compiler/lowtest -o dist/lowtest

      - name: Test
        run: dist/lowtest "$GITHUB_WORKSPACE/dist/low" run fail lint examples

  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: low-windows
          path: dist

      - name: Test the fixtures
        run: dist/lowtest.exe "$GITHUB_WORKSPACE/dist/low.exe" windows

      - name: Test the Win32 platform
        run: dist/ui-tests.exe -run win32

  tests:
    name: tests (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: low
            programs: low
          - name: lsp
            programs: lsp
          - name: compiler
            programs: amd64 asm ast check compiler editors fixture fuzz hot ir lexer link prelude regex shaders tablegen target ui vkgen wlgen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: low
          path: dist

      - name: Put low on PATH
        run: |
          chmod +x dist/low
          echo "$GITHUB_WORKSPACE/dist" >> "$GITHUB_PATH"

      - name: Install libraries linked by test programs
        if: matrix.name == 'low'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Test
        env:
          PROGRAMS: ${{ matrix.programs }}
        run: |
          status=0
          for name in $PROGRAMS; do
            echo "::group::compiler/tests/$name"
            low run "compiler/tests/$name" || status=1
            echo "::endgroup::"
          done
          exit $status
