name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: programs
            packages: ./cmd/low
          - name: packages
            packages: $(go list ./... | grep -vx lowlang/cmd/low)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: go-build-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('go.mod') }}-

      - name: Install libraries linked by test programs, and wine for the Windows builds
        if: matrix.name == 'programs'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev wine wine64

      - name: Let Chromium create its sandbox for the std/cdp programs
        if: matrix.name == 'programs'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Vet
        if: matrix.name == 'packages'
        run: go vet ./...

      - name: Test
        run: go test ${{ matrix.packages }}
