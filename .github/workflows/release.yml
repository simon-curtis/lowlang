name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
        run: |
          flags="-s -w -X main.version=$GITHUB_REF_NAME"
          GOOS=linux go build -trimpath -ldflags="$flags" -o dist/low-linux-amd64 ./cmd/low
          GOOS=windows go build -trimpath -ldflags="$flags" -o dist/low-windows-amd64.exe ./cmd/low

      - name: Check the stamped version
        run: test "$(dist/low-linux-amd64 version)" = "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/low-linux-amd64 dist/low-windows-amd64.exe --verify-tag --generate-notes
