name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Stamp the tag
        run: printf '%s\n' "$GITHUB_REF_NAME" > compiler/low/version.txt

      - name: Build for Linux
        run: ./bootstrap.sh dist/low-linux-amd64

      - name: Build for Windows
        run: dist/low-linux-amd64 build compiler/low -target windows/amd64 -o dist/low-windows-amd64.exe

      - name: Check the stamped version
        run: test "$(dist/low-linux-amd64 version)" = "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/low-linux-amd64 dist/low-windows-amd64.exe --verify-tag --generate-notes
