name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Stamp the tag
        run: printf '%s\n' "$TAG" > compiler/low/version.txt

      - name: Build for Linux
        run: ./bootstrap.sh dist/low-linux-amd64

      - name: Build for Windows
        run: dist/low-linux-amd64 build compiler/low --target windows/amd64 -o dist/low-windows-amd64.exe

      - name: Check the stamped version
        run: test "$(dist/low-linux-amd64 version)" = "$TAG"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" dist/low-linux-amd64 dist/low-windows-amd64.exe --target "$(git rev-parse HEAD)" --generate-notes

      - name: Move bootstrap.txt to the release
        run: |
          hash=$(sha256sum dist/low-linux-amd64 | cut -d ' ' -f 1)
          git restore compiler/low/version.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main FETCH_HEAD
            printf 'release %s\nsha256 %s\n' "$TAG" "$hash" > bootstrap.txt
            git diff --quiet && exit 0
            git commit -am "build(bootstrap): build with $TAG"
            git push origin main && exit 0
          done
          exit 1
