name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap the compiler
        run: ./bootstrap.sh dist/low

      - name: Build the compiler for Windows
        run: dist/low build compiler/low --target windows/amd64 -o dist/low.exe

      - uses: actions/upload-artifact@v5
        with:
          name: low
          path: dist/low
          if-no-files-found: error

  site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: low
          path: dist

      - name: Build the compiler from the tree
        run: |
          chmod +x dist/low
          mkdir -p "$RUNNER_TEMP/bin"
          dist/low build compiler/low -o "$RUNNER_TEMP/bin/low"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: site
          node-version: 24
          cache: true

      - name: Build the site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp run site
