name: patch

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: patch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Pick the next patch version
        id: next
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already released"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          tools="bench emit fixture fuzz gentest ident lowfuzz lowtest oracletool peakrss playground shadergen shaders tablegen tests vkgen wlgen"
          shipped="compiler std"
          for tool in $tools; do
            shipped="$shipped :(exclude)compiler/$tool"
          done
          if git diff --quiet "$last" HEAD -- $shipped; then
            echo "The compiler and standard library are unchanged since $last"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          major_minor=${latest%.*}
          patch=${latest##*.}
          tag="$major_minor.$((patch + 1))"
          echo "Releasing $tag after $last"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      ref: ${{ github.event.workflow_run.head_sha }}
